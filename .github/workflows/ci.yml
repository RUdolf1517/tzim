name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: never

jobs:
  # Two configurations, on every platform (#68). Until v0.13 the only `cargo
  # test` in this repository was `--all-features`, which is the configuration
  # nobody ships: `default` turns `jpeg-v1` off, so `--info` prints a different
  # sentence and `verify` takes a different path for a JPEG candidate. A branch
  # that only a release executes is a branch nothing executes.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `all-features` is the widest build; `default` is what a published
        # binary is compiled with (Cargo.toml `default = [...]`).
        features: [all-features, default]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The ENOSPC test needs a filesystem that can be filled to the last page,
      # and there is no portable way to make one: a 2 MiB tmpfs is. If the runner
      # refuses the mount the step warns and the test says it was skipped, so a
      # sandbox without privileges loses coverage instead of turning the job red.
      - name: A tiny tmpfs for the full-disk test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -u
          dir="$RUNNER_TEMP/tzim-full"
          mkdir -p "$dir"
          if sudo mount -t tmpfs -o size=2M tmpfs "$dir"; then
            sudo chmod 1777 "$dir"
            echo "TZIM_TEST_FULL_DISK=$dir" >> "$GITHUB_ENV"
          else
            echo "::warning::could not mount a tmpfs; t_fs_13 will skip"
          fi

      - name: Build and test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # An empty `flags` disappears in the word split below, which is what
          # `default` wants: the plain `cargo test` a user runs.
          case "${{ matrix.features }}" in
            all-features) flags=--all-features ;;
            default) flags= ;;
            *) echo "::error::unknown feature set '${{ matrix.features }}'"; exit 2 ;;
          esac
          cargo test $flags --locked 2>&1 | tee "/tmp/tzim-test-${{ matrix.os }}-${{ matrix.features }}.log"

      - name: Publish failure log
        if: steps.test.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh "/tmp/tzim-test-${{ matrix.os }}-${{ matrix.features }}.log" "test-${{ matrix.os }}-${{ matrix.features }}"

      - name: Fail the job
        if: steps.test.outcome == 'failure'
        shell: bash
        run: exit 1

  # The smallest build that still has a handler (#68): `png` alone, with every
  # feature that is not PNG switched off. Nothing in this repository had ever
  # compiled it, let alone run it, and it is the configuration a user gets from
  # `cargo build --no-default-features --features png`.
  #
  # One platform, because this is a configuration check and not a portability
  # check: the three operating systems are covered by the `test` matrix above.
  #
  # Integration tests are compiled here and not run. Of the 120 tests in
  # `tests/integration.rs`, 65 assert what gzip, ZIP, ICO, JPEG, TIFF, zlib or
  # `--zopfli` do, and in this build those handlers are not compiled in — the
  # tests would fail on "unsupported", not on a defect. Gating 65 of them one by
  # one would not add coverage to this leg, it would take the leg's meaning away,
  # so the targets that can run are named explicitly instead. Nothing is filtered
  # by name: a filter would silently run fewer tests as the suite grows, which is
  # the failure mode this job exists to avoid.
  minimal:
    name: minimal (png only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build and test the minimal configuration
        id: minimal
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            # The markers are for the failure report: ci-report.sh publishes the
            # tail of this log, and the tail has to say which of the two
            # commands it came from.
            echo "=== 1/2 compile every test target (--no-run) ==="
            # Every test target has to compile in this configuration, including
            # the ones that cannot run in it. A test file that stops building
            # for `--features png` is a test file that has quietly become
            # all-features-only, and `--no-run` is what notices. This also
            # builds the binary itself, which the integration target links.
            cargo test --no-default-features --features png --no-run --locked
            echo "=== 2/2 run the targets whose assertions hold here ==="
            # The library's unit tests (each handler module is gated, so the PNG
            # ones run), the verifier tests, and the shipped-document checks.
            cargo test --no-default-features --features png --locked \
              --lib --test verification --test packaging
          } 2>&1 | tee /tmp/tzim-minimal.log

      - name: Publish failure log
        if: steps.minimal.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-minimal.log minimal

      - name: Fail the job
        if: steps.minimal.outcome == 'failure'
        shell: bash
        run: exit 1

  # A script/docs-only change must not replay already reviewed FITS candidates.
  # The exact-SHA HEASARC residual gate has its own selected rows for that case;
  # this broader Astropy oracle runs when the FITS implementation or its oracle
  # harness changes, and on non-PR pushes where the changed range is explicit.
  fits-change-scope:
    name: detect FITS implementation changes
    runs-on: ubuntu-latest
    outputs:
      run_oracle: ${{ steps.scope.outputs.run_oracle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select implementation diff
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="$(git merge-base origin/main "$EVENT_SHA")"
          fi
          git diff --name-only "$base" "$EVENT_SHA" | tee /tmp/fits-changed-files.txt
          if grep -Eq '^(src/|\.github/scripts/fits-oracle\.py$|Cargo\.toml$|Cargo\.lock$|build\.rs$)' /tmp/fits-changed-files.txt; then
            run_oracle=true
          else
            run_oracle=false
          fi
          echo "run_oracle=$run_oracle" >> "$GITHUB_OUTPUT"
          echo "Astropy FITS oracle required: $run_oracle"

  # FITS has a separate Astropy/CFITSIO check for the array round trip. This is
  # not the HEASARC release gate: `fits-heasarc.yml` runs fitsverify and funpack
  # on exact-SHA candidates. Keep their evidence and guarantees distinct; neither
  # job alone is full-format admission or a runtime read-back in every binary.
  fits-oracle:
    name: fits oracle (astropy)
    needs: [fits-change-scope]
    if: needs.fits-change-scope.outputs.run_oracle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install astropy
        shell: bash
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --disable-pip-version-check numpy astropy
          /tmp/venv/bin/python -c "import astropy; print('astropy', astropy.__version__)"

      - name: Build with the fits feature and check the output (#70)
        id: oracle
        continue-on-error: true
        shell: bash
        run: |
          # One log for both halves: a build failure and a verification failure
          # are the same answer to "does the second implementation accept it".
          {
            cargo build --release --locked --features fits
            /tmp/venv/bin/python .github/scripts/fits-oracle.py --binary target/release/tzim
          } 2>&1 | tee /tmp/tzim-fits.log

      - name: Publish failure log
        if: steps.oracle.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-fits.log fits

      - name: Fail the job
        if: steps.oracle.outcome == 'failure'
        shell: bash
        run: exit 1

  docs:
    name: docs (links and anchors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A link to a renamed heading is a documentation bug that survives review
      # because nobody clicks 226 links. This job clicks them (#46).
      - name: Check Markdown links and anchors
        shell: bash
        run: |
          out="$(python3 .github/scripts/md-links.py)"
          echo "$out"
          case "$out" in
            *"broken: 0"*) ;;
            *) echo "::error::broken links or anchors; see the lines above"; exit 1 ;;
          esac

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0

      # The floor in `Cargo.toml` is a promise to everyone who builds from a
      # source tarball or a distribution package. A dependency that silently
      # requires a newer compiler breaks that promise, and this is the job that
      # finds out.
      - name: Build with the minimum supported toolchain
        id: msrv
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo build --all-features --locked 2>&1 | tee /tmp/tzim-msrv.log

      - name: Publish failure log
        if: steps.msrv.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-msrv.log msrv

      - name: Fail the job
        if: steps.msrv.outcome == 'failure'
        shell: bash
        run: exit 1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings 2>&1 | tee /tmp/tzim-clippy.log

      - name: Publish failure log
        if: steps.clippy.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-clippy.log clippy

      - name: Fail the job
        if: steps.clippy.outcome == 'failure'
        shell: bash
        run: exit 1

  # rustfmt has never run over this tree, and the environment the project is
  # written in cannot run it (docs/testing.md §4.1). So on a branch push this job
  # formats the tree and commits the result; on a pull request it only checks.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `ci-report.sh` publishes the failing log as a pull-request comment, and
      # a job-level `permissions` block *replaces* the workflow's: with
      # `contents` alone the comment is a 403 and the failure is silent, which
      # is what happened to this job's own log until it was noticed.
      pull-requests: write
    # The same group as the `lockfile` job: the two writers must not race.
    concurrency:
      group: branch-write-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        if: github.event_name == 'pull_request'
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee /tmp/tzim-fmt.log

      - name: Format and commit
        if: github.event_name != 'pull_request'
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee /tmp/tzim-fmt.log
          if [ -z "$(git status --porcelain)" ]; then
            echo "the tree is already formatted"
            exit 0
          fi
          git --no-pager diff --stat | tee -a /tmp/tzim-fmt.log
          git config user.name "tzim ci"
          git config user.email "ci@tzim.invalid"
          git add -A
          git commit -m "style: cargo fmt, applied by CI"
          if git push origin "HEAD:refs/heads/${{ github.ref_name }}"; then
            echo "::error::rustfmt changed the tree; the formatted commit is pushed, re-run this job"
          else
            echo "::error::rustfmt changed the tree and the branch is not writable; run cargo fmt locally"
          fi
          exit 1

      - name: Publish failure log
        if: steps.check.outcome == 'failure' || steps.apply.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-fmt.log fmt

      - name: Fail the job
        if: steps.check.outcome == 'failure' || steps.apply.outcome == 'failure'
        shell: bash
        run: exit 1

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Licences, advisories, duplicate versions and registry sources, from the
      # allow-list in docs/dependencies.md §5.
      - name: cargo deny check
        id: deny
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo deny check 2>&1 | tee /tmp/tzim-deny.log

      - name: Publish failure log
        if: steps.deny.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-deny.log deny

      - name: Fail the job
        if: steps.deny.outcome == 'failure'
        shell: bash
        run: exit 1

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Reads the committed lock file, so it tests what a release would ship.
      - name: cargo audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo audit 2>&1 | tee /tmp/tzim-audit.log

      - name: Publish failure log
        if: steps.audit.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-audit.log audit

      - name: Fail the job
        if: steps.audit.outcome == 'failure'
        shell: bash
        run: exit 1

  # What a release does that a test cannot: it packages. `cargo package` builds
  # the crate from the tarball it would upload to crates.io, which is the only
  # way to find out that a file is missing from it, that the readme path is
  # wrong, or that the crate does not build outside a git checkout.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Package, then build from the package
        id: package
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo package --locked 2>&1 | tee /tmp/tzim-package.log
          ls -l target/package/

      - name: Publish failure log
        if: steps.package.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-package.log package

      - name: Fail the job
        if: steps.package.outcome == 'failure'
        shell: bash
        run: exit 1

  # The installer is the first thing most users run, and it downloads from a
  # release that already exists — so the network path, the checksum lookup and
  # the archive layout are all tested against the published artifacts rather
  # than against a local build.
  installer:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the published release into a temporary directory
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dir="${RUNNER_TEMP}/tzim-install"
          rm -rf "$dir"
          # The latest release, not this branch's build: the point is that the
          # script and the artifacts agree today.
          TZIM_INSTALL_DIR="$dir" sh ./install.sh 2>&1 | tee /tmp/tzim-install.log
          "$dir/tzim" --version | tee -a /tmp/tzim-install.log
          "$dir/tzim" --list-formats | tee -a /tmp/tzim-install.log

      - name: Refuse a corrupted download
        id: corrupt
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # A mirror that serves the wrong bytes has to be caught, not installed.
          # The asset is downloaded here, one byte is appended, and the doctored
          # copy is served next to the release's real SHA256SUMS: the installer
          # must abort, and must leave nothing behind.
          work="${RUNNER_TEMP}/tzim-corrupt"
          rm -rf "$work"
          mkdir -p "$work/serve" "$work/prefix"

          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) asset=tzim-x86_64-unknown-linux-musl.tar.gz ;;
            Darwin/arm64) asset=tzim-aarch64-apple-darwin.tar.gz ;;
            *) echo "no asset name for this runner"; exit 1 ;;
          esac

          base="https://github.com/RUdolf1517/tzim/releases/latest/download"
          curl -fsSL "$base/$asset" -o "$work/serve/$asset"
          curl -fsSL "$base/SHA256SUMS" -o "$work/serve/SHA256SUMS"
          printf 'x' >> "$work/serve/$asset"

          (cd "$work/serve" && python3 -m http.server 8123 >/dev/null 2>&1) &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 2

          if TZIM_BASE_URL="http://127.0.0.1:8123" TZIM_INSTALL_DIR="$work/prefix" \
              sh ./install.sh > "$work/log" 2>&1; then
            echo "a corrupted archive was installed" >&2
            cat "$work/log" >&2
            exit 1
          fi
          cat "$work/log"
          grep -q "SHA-256 mismatch" "$work/log"
          test ! -e "$work/prefix/tzim"

      - name: Publish failure log
        if: steps.install.outcome == 'failure' || steps.corrupt.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat /tmp/tzim-install.log 2>/dev/null
            cat "${RUNNER_TEMP}/tzim-corrupt/log" 2>/dev/null
          } > /tmp/tzim-installer.log
          bash .github/scripts/ci-report.sh /tmp/tzim-installer.log installer

      - name: Fail the job
        if: steps.install.outcome == 'failure' || steps.corrupt.outcome == 'failure'
        shell: bash
        run: exit 1

  size:
    name: binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        id: size
        continue-on-error: true
        shell: bash
        run: |
          # Everything this step prints goes to the log file, not only the
          # compiler output: when the gate below fails, the failure report has to
          # contain the number that tripped it.
          exec > >(tee /tmp/tzim-size.log) 2>&1
          set -o pipefail
          # Default features only, which is what a release ships: `--all-features`
          # would compile the fuzz entry points into the measured binary.
          cargo build --release --locked --target x86_64-unknown-linux-musl
          ls -l target/x86_64-unknown-linux-musl/release/tzim
          # The released artifact must not need a C library. `file` is the cheap
          # check that says so; a dynamic build would still pass the size gate.
          # The output is captured rather than piped into `grep -q`: this script
          # runs under `pipefail`, and `grep -q` closing the pipe early makes the
          # pipeline look like a failure.
          kind="$(file -b target/x86_64-unknown-linux-musl/release/tzim)"
          echo "$kind"
          # `file` says "static-pie linked" for the position-independent static
          # binary the musl target now produces, and "statically linked" for the
          # older form. Both mean the same thing here: no interpreter, no libc.
          case "$kind" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *) echo "the musl build is not statically linked: $kind" >&2; exit 1 ;;
          esac
          bytes=$(stat -c '%s' target/x86_64-unknown-linux-musl/release/tzim)
          echo "$bytes" > /tmp/tzim-size-bytes.txt
          # Keep the shipping binary: the matrix below overwrites the path.
          cp target/x86_64-unknown-linux-musl/release/tzim /tmp/tzim-full
          # The gate is this release's own measurement, to the byte, and not a
          # percentage above it: v0.12.1 left 150 KiB of headroom underneath a
          # "green" check and the assets still grew, which is what #62 was
          # about. v0.13 measures 979 808 bytes; `jpeg-v1` was measured at
          # +118 784 and stays off for that reason (#39). A toolchain bump is
          # the one thing that moves this number without a code change, and it
          # is updated in the pull request that needs it, with the reason in
          # docs/size-budget.md §1.
          budget=979808
          echo "bytes: $bytes, budget: $budget"
          test "$bytes" -le "$budget" || {
            echo "the static binary is $((bytes / 1024)) KiB, over the $((budget / 1024)) KiB budget" >&2
            exit 1
          }

      # What each handler costs. Measured, not inferred: the numbers in
      # docs/size-budget.md come from this table.
      - name: Feature matrix
        id: matrix
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          out=/tmp/tzim-features.txt
          printf '%-38s %10s %8s\n' "features" "bytes" "KiB" > "$out"
          printf '%-38s %10s %8s\n' "--------------------------------------" "----------" "--------" >> "$out"
          # The row after `+jpeg` is what a release ships (no `jpeg-v1`); the rows
          # after it carry the decoders and formats that are off by default —
          # `jpeg-v1`, `fits` — which is how their cost is measured rather than
          # guessed.
          for features in \
            "png" \
            "png,gzip" \
            "png,gzip,zip" \
            "png,gzip,zip,ico" \
            "png,gzip,zip,ico,jpeg" \
            "png,gzip,zip,ico,jpeg,tiff,zlib,zopfli" \
            "png,gzip,zip,ico,jpeg,tiff,zlib,zopfli,fits" \
            "png,gzip,zip,ico,jpeg,jpeg-v1" \
            "png,gzip,zip,ico,jpeg,jpeg-v1,tiff,zlib,zopfli" \
            "png,gzip,zip,ico,jpeg,jpeg-v1,tiff,zlib,zopfli,fits"
          do
            cargo build --release --locked --target x86_64-unknown-linux-musl \
              --no-default-features --features "$features" 2>&1 | tail -2
            bytes=$(stat -c '%s' target/x86_64-unknown-linux-musl/release/tzim)
            printf '%-38s %10s %8s\n' "$features" "$bytes" "$((bytes / 1024))" >> "$out"
          done
          cat "$out"

      - name: Report size
        if: steps.size.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            bytes=$(cat /tmp/tzim-size-bytes.txt)
            deps=$(cargo tree --locked --edges normal --prefix none | sed 's/ (\*)//' | sort -u | wc -l)
            echo "static musl binary: ${bytes} bytes ($((bytes / 1024)) KiB)"
            echo "normal dependency lines: ${deps}"
            echo
            echo "feature builds:"
            cat /tmp/tzim-features.txt 2>/dev/null || echo "(the matrix step did not run)"
            echo
            echo "sections:"
            llvm-size -A /tmp/tzim-full 2>/dev/null | head -12 || true
          } | tee /tmp/tzim-size-report.txt
          bash .github/scripts/ci-report.sh /tmp/tzim-size-report.txt size report

      - name: Publish failure log
        if: steps.size.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-size.log size

      - name: Fail the job
        if: steps.size.outcome == 'failure'
        shell: bash
        run: exit 1
