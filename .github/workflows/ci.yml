name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features 2>&1 | tee "/tmp/tzim-test-${{ matrix.os }}.log"

      - name: Publish failure log
        if: steps.test.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh "/tmp/tzim-test-${{ matrix.os }}.log" "test-${{ matrix.os }}"

      - name: Fail the job
        if: steps.test.outcome == 'failure'
        shell: bash
        run: exit 1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/tzim-clippy.log

      - name: Publish failure log
        if: steps.clippy.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-clippy.log clippy

      - name: Fail the job
        if: steps.clippy.outcome == 'failure'
        shell: bash
        run: exit 1

  profile:
    # Temporary: measures profile variants and the biggest symbols so that a
    # size change is a measurement, not a guess. Removed before merge.
    name: profile experiments
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils

      - name: Variants
        shell: bash
        run: |
          set -o pipefail
          out=/tmp/tzim-profile.txt
          printf '| variant | bytes | KiB | vs baseline |\n| --- | --- | --- | --- |\n' > "$out"
          base=0
          build() {
            local name="$1"; shift
            env "$@" cargo build --release --target x86_64-unknown-linux-musl -q 2>&1 | tail -3
            local bytes
            bytes=$(stat -c '%s' target/x86_64-unknown-linux-musl/release/tzim)
            [ "$base" = 0 ] && base=$bytes
            printf '| %s | %s | %s | %+d |\n' "$name" "$bytes" "$((bytes / 1024))" "$((bytes - base))" >> "$out"
          }
          build baseline
          build "opt=s" CARGO_PROFILE_RELEASE_OPT_LEVEL=s
          build "opt=2" CARGO_PROFILE_RELEASE_OPT_LEVEL=2
          build "opt=s, force-unwind-tables=no" CARGO_PROFILE_RELEASE_OPT_LEVEL=s "RUSTFLAGS=-C force-unwind-tables=no"
          build "baseline, force-unwind-tables=no" "RUSTFLAGS=-C force-unwind-tables=no"

          # Dependencies keep -O3 while this crate shrinks for size.
          cp Cargo.toml /tmp/Cargo.toml.orig
          printf '\n[profile.release.package."*"]\nopt-level = 3\n' >> Cargo.toml
          build "opt=s, deps opt=3" CARGO_PROFILE_RELEASE_OPT_LEVEL=s
          cp /tmp/Cargo.toml.orig Cargo.toml
          cat "$out"

      - name: Where the bytes are
        shell: bash
        run: |
          set -o pipefail
          out=/tmp/tzim-profile.txt
          CARGO_PROFILE_RELEASE_STRIP=none cargo build --release --target x86_64-unknown-linux-musl -q
          cp target/x86_64-unknown-linux-musl/release/tzim /tmp/tzim-unstripped
          nm -C -S -t d /tmp/tzim-unstripped > /tmp/tzim-nm.txt 2>/dev/null || true
          {
            echo
            echo "### bytes of code by crate"
            echo '```'
            awk '$2 ~ /^[0-9]+$/ && $3 ~ /^[a-zA-Z]$/ {
                   name = $4
                   cat = "other"
                   if (name ~ /gimli/ || name ~ /addr2line/ || name ~ /unwind/ || name ~ /backtrace/) cat = "gimli/addr2line/unwind"
                   else if (name ~ /miniz_oxide/) cat = "miniz_oxide"
                   else if (name ~ /zopfli/) cat = "zopfli"
                   else if (name ~ /fdeflate/) cat = "fdeflate"
                   else if (name ~ /^png::/ || name ~ /<png::/) cat = "png"
                   else if (name ~ /flate2/) cat = "flate2"
                   else if (name ~ /tzim/) cat = "tzim"
                   else if (name ~ /core::fmt/) cat = "core::fmt"
                   else if (name ~ /std::/) cat = "std"
                   total[cat] += $2
                 }
                 END { for (c in total) printf "%-26s %8d  %6d KiB\n", c, total[c], total[c] / 1024 }' /tmp/tzim-nm.txt | sort -k2 -n -r
            echo '```'
            echo
            echo "### strings that only a panic printer needs"
            echo '```'
            for needle in gimli addr2line "RUST_BACKTRACE" "note: run with"; do
              printf '%-16s %s\n' "$needle" "$(strings -a /tmp/tzim-unstripped | grep -c -- "$needle" || true)"
            done
            echo '```'
            echo
            echo "### section sizes"
            echo '```'
            size -A /tmp/tzim-unstripped | head -12
            echo '```'
          } >> "$out"
          cat "$out"

      - name: Speed on real files
        shell: bash
        run: |
          set -o pipefail
          out=/tmp/tzim-speed.txt
          bash .github/scripts/corpus-fetch.sh "$RUNNER_TEMP/corpus-work" > /dev/null
          corpus="$RUNNER_TEMP/corpus-work/corpus"
          printf '| build | PNG corpus | JPEG corpus | saved bytes |\n| --- | --- | --- | --- |\n' > "$out"
          speed() {
            local name="$1" slug="$2"; shift 2
            env "$@" cargo build --release --target x86_64-unknown-linux-musl -q
            cp target/x86_64-unknown-linux-musl/release/tzim "/tmp/tzim-$slug"
            local start mid end png jpeg saved
            # One untimed pass first: the page cache should not decide this.
            rm -rf /tmp/speed-warm && cp -r "$corpus" /tmp/speed-warm
            "/tmp/tzim-$slug" -r --formats png --jobs 1 /tmp/speed-warm/images > /dev/null 2>&1 || true
            rm -rf /tmp/speed-a && cp -r "$corpus" /tmp/speed-a
            start=$(date +%s%N)
            "/tmp/tzim-$slug" -r --formats png --jobs 1 /tmp/speed-a/images > /dev/null 2>&1 || true
            mid=$(date +%s%N)
            rm -rf /tmp/speed-b && cp -r "$corpus" /tmp/speed-b
            "/tmp/tzim-$slug" -r --formats jpeg --jobs 1 /tmp/speed-b/images > /dev/null 2>&1 || true
            end=$(date +%s%N)
            saved=$(du -sb "$corpus" | cut -f1)
            saved=$(( saved - $(du -sb /tmp/speed-a | cut -f1) - $(du -sb /tmp/speed-b | cut -f1) ))
            printf '| %s | %s ms | %s ms | %s |\n' "$name" "$(( (mid - start) / 1000000 ))" "$(( (end - mid) / 1000000 ))" "$saved" >> "$out"
          }
          speed "opt=3 (baseline)" opt3
          speed "opt=s" opts CARGO_PROFILE_RELEASE_OPT_LEVEL=s
          cat "$out" >> /tmp/tzim-profile.txt
          cat "$out"

      - name: Does a hello world pay for the same backtrace code
        shell: bash
        run: |
          set -o pipefail
          out=/tmp/tzim-profile.txt
          mkdir -p /tmp/hello/src
          cd /tmp/hello
          printf '[package]\nname = "hello"\nversion = "0.1.0"\nedition = "2021"\n\n[profile.release]\nopt-level = 3\nlto = "fat"\ncodegen-units = 1\npanic = "abort"\nstrip = "none"\n' > Cargo.toml
          printf 'fn main() { println!("hi"); }\n' > src/main.rs
          cargo build --release --target x86_64-unknown-linux-musl -q
          hello=target/x86_64-unknown-linux-musl/release/hello
          {
            echo
            echo "### hello world, same profile"
            echo '```'
            printf 'size        %s bytes\n' "$(stat -c '%s' "$hello")"
            printf 'gimli syms  %s\n' "$(nm -C "$hello" 2>/dev/null | grep -c gimli || true)"
            printf 'unwind syms %s\n' "$(nm -C "$hello" 2>/dev/null | grep -cE 'libunwind|addr2line' || true)"
            echo '```'
            echo
            echo "### panic machinery in tzim"
            echo '```'
            nm -C /tmp/tzim-unstripped | grep -E "rust_panic_with_hook|default_hook|Backtrace::capture|begin_panic_handler|rust_begin_unwind|rust_eh_personality|panic_abort" | head -20 || true
            echo '```'
          } >> "$out"
          cat "$out"

      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-profile.txt profile report

  size:
    name: binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        id: size
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # Default features only, which is what a release ships: `--all-features`
          # would compile the fuzz entry points into the measured binary.
          cargo build --release --target x86_64-unknown-linux-musl 2>&1 | tee /tmp/tzim-size.log
          ls -l target/x86_64-unknown-linux-musl/release/tzim
          file target/x86_64-unknown-linux-musl/release/tzim
          bytes=$(stat -c '%s' target/x86_64-unknown-linux-musl/release/tzim)
          echo "$bytes" > /tmp/tzim-size-bytes.txt
          # Keep the shipping binary: the matrix below overwrites the path.
          cp target/x86_64-unknown-linux-musl/release/tzim /tmp/tzim-full
          # docs/size-budget.md 1: measured 1 024 KiB + 15 %.
          budget=1206856
          echo "bytes: $bytes, budget: $budget"
          test "$bytes" -le "$budget" || {
            echo "the static binary is $((bytes / 1024)) KiB, over the $((budget / 1024)) KiB budget" >&2
            exit 1
          }

      # What each handler costs. Measured, not inferred: the numbers in
      # docs/size-budget.md come from this table.
      - name: Feature matrix
        id: matrix
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          out=/tmp/tzim-features.txt
          printf '%-38s %10s %8s\n' "features" "bytes" "KiB" > "$out"
          printf '%-38s %10s %8s\n' "--------------------------------------" "----------" "--------" >> "$out"
          for features in \
            "png" \
            "png,gzip" \
            "png,gzip,zip" \
            "png,gzip,zip,ico" \
            "png,gzip,zip,ico,jpeg" \
            "png,gzip,zip,ico,jpeg,tiff" \
            "png,gzip,zip,ico,jpeg,tiff,zopfli"
          do
            cargo build --release --target x86_64-unknown-linux-musl \
              --no-default-features --features "$features" 2>&1 | tail -2
            bytes=$(stat -c '%s' target/x86_64-unknown-linux-musl/release/tzim)
            printf '%-38s %10s %8s\n' "$features" "$bytes" "$((bytes / 1024))" >> "$out"
          done
          cat "$out"

      - name: Report size
        if: steps.size.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            bytes=$(cat /tmp/tzim-size-bytes.txt)
            deps=$(cargo tree --edges normal --prefix none | sed 's/ (\*)//' | sort -u | wc -l)
            echo "static musl binary: ${bytes} bytes ($((bytes / 1024)) KiB)"
            echo "normal dependency lines: ${deps}"
            echo
            echo "feature builds:"
            cat /tmp/tzim-features.txt 2>/dev/null || echo "(the matrix step did not run)"
            echo
            echo "sections:"
            llvm-size -A /tmp/tzim-full 2>/dev/null | head -12 || true
          } | tee /tmp/tzim-size-report.txt
          bash .github/scripts/ci-report.sh /tmp/tzim-size-report.txt size report

      - name: Publish failure log
        if: steps.size.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-size.log size

      - name: Fail the job
        if: steps.size.outcome == 'failure'
        shell: bash
        run: exit 1
