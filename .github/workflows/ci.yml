name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features 2>&1 | tee "/tmp/tzim-test-${{ matrix.os }}.log"

      - name: Publish failure log
        if: steps.test.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh "/tmp/tzim-test-${{ matrix.os }}.log" "test-${{ matrix.os }}"

      - name: Fail the job
        if: steps.test.outcome == 'failure'
        shell: bash
        run: exit 1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/tzim-clippy.log

      - name: Publish failure log
        if: steps.clippy.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-clippy.log clippy

      - name: Fail the job
        if: steps.clippy.outcome == 'failure'
        shell: bash
        run: exit 1

  profile:
    # Temporary: compares -O3 with -Os on size and on the real corpus, so that a
    # profile change is a measurement rather than a guess. Removed before merge.
    name: profile experiments
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils

      - name: Measure
        shell: bash
        run: |
          set -o pipefail
          out=/tmp/tzim-profile.txt
          bash .github/scripts/corpus-fetch.sh "$RUNNER_TEMP/corpus-work" > /dev/null
          corpus="$RUNNER_TEMP/corpus-work/corpus"
          base_size=$(du -sb "$corpus" | cut -f1)
          {
            echo "| build | bytes | KiB | PNG corpus | JPEG corpus | bytes written |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } > "$out"
          measure() {
            local name="$1" slug="$2"; shift 2
            env "$@" cargo build --release --target x86_64-unknown-linux-musl -q
            local bin="/tmp/tzim-$slug"
            cp target/x86_64-unknown-linux-musl/release/tzim "$bin"
            local bytes start mid end after
            bytes=$(stat -c '%s' "$bin")
            # One untimed pass so the page cache does not decide the result.
            rm -rf /tmp/warm && cp -r "$corpus" /tmp/warm
            "$bin" -r --formats png --jobs 1 /tmp/warm/images > /dev/null 2>&1 || true
            rm -rf /tmp/run && cp -r "$corpus" /tmp/run
            start=$(date +%s%N)
            "$bin" -r --formats png --jobs 1 /tmp/run/images > /dev/null 2>&1 || true
            mid=$(date +%s%N)
            "$bin" -r --formats jpeg --jobs 1 /tmp/run/images > /dev/null 2>&1 || true
            end=$(date +%s%N)
            after=$(du -sb /tmp/run | cut -f1)
            printf '| %s | %s | %s | %s ms | %s ms | %s |\n' \
              "$name" "$bytes" "$((bytes / 1024))" \
              "$(( (mid - start) / 1000000 ))" "$(( (end - mid) / 1000000 ))" \
              "$(( base_size - after ))" >> "$out"
          }
          # Two runs per variant, the faster one counts: the runner is noisy.
          measure "opt=3" opt3
          measure "opt=3 (repeat)" opt3b
          measure "opt=s" opts CARGO_PROFILE_RELEASE_OPT_LEVEL=s
          measure "opt=s (repeat)" optsb CARGO_PROFILE_RELEASE_OPT_LEVEL=s
          cp Cargo.toml /tmp/Cargo.toml.orig
          printf '\n[profile.release.package."*"]\nopt-level = 3\n' >> Cargo.toml
          measure "opt=s, deps opt=3" optsdeps CARGO_PROFILE_RELEASE_OPT_LEVEL=s
          measure "opt=s, deps opt=3 (repeat)" optsdepsb CARGO_PROFILE_RELEASE_OPT_LEVEL=s
          cp /tmp/Cargo.toml.orig Cargo.toml
          cat "$out"

      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-profile.txt profile report

  size:
    name: binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        id: size
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # Default features only, which is what a release ships: `--all-features`
          # would compile the fuzz entry points into the measured binary.
          cargo build --release --target x86_64-unknown-linux-musl 2>&1 | tee /tmp/tzim-size.log
          ls -l target/x86_64-unknown-linux-musl/release/tzim
          file target/x86_64-unknown-linux-musl/release/tzim
          bytes=$(stat -c '%s' target/x86_64-unknown-linux-musl/release/tzim)
          echo "$bytes" > /tmp/tzim-size-bytes.txt
          # Keep the shipping binary: the matrix below overwrites the path.
          cp target/x86_64-unknown-linux-musl/release/tzim /tmp/tzim-full
          # docs/size-budget.md 1: measured 1 024 KiB + 15 %.
          budget=1206856
          echo "bytes: $bytes, budget: $budget"
          test "$bytes" -le "$budget" || {
            echo "the static binary is $((bytes / 1024)) KiB, over the $((budget / 1024)) KiB budget" >&2
            exit 1
          }

      # What each handler costs. Measured, not inferred: the numbers in
      # docs/size-budget.md come from this table.
      - name: Feature matrix
        id: matrix
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          out=/tmp/tzim-features.txt
          printf '%-38s %10s %8s\n' "features" "bytes" "KiB" > "$out"
          printf '%-38s %10s %8s\n' "--------------------------------------" "----------" "--------" >> "$out"
          for features in \
            "png" \
            "png,gzip" \
            "png,gzip,zip" \
            "png,gzip,zip,ico" \
            "png,gzip,zip,ico,jpeg" \
            "png,gzip,zip,ico,jpeg,tiff" \
            "png,gzip,zip,ico,jpeg,tiff,zopfli"
          do
            cargo build --release --target x86_64-unknown-linux-musl \
              --no-default-features --features "$features" 2>&1 | tail -2
            bytes=$(stat -c '%s' target/x86_64-unknown-linux-musl/release/tzim)
            printf '%-38s %10s %8s\n' "$features" "$bytes" "$((bytes / 1024))" >> "$out"
          done
          cat "$out"

      - name: Report size
        if: steps.size.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            bytes=$(cat /tmp/tzim-size-bytes.txt)
            deps=$(cargo tree --edges normal --prefix none | sed 's/ (\*)//' | sort -u | wc -l)
            echo "static musl binary: ${bytes} bytes ($((bytes / 1024)) KiB)"
            echo "normal dependency lines: ${deps}"
            echo
            echo "feature builds:"
            cat /tmp/tzim-features.txt 2>/dev/null || echo "(the matrix step did not run)"
            echo
            echo "sections:"
            llvm-size -A /tmp/tzim-full 2>/dev/null | head -12 || true
          } | tee /tmp/tzim-size-report.txt
          bash .github/scripts/ci-report.sh /tmp/tzim-size-report.txt size report

      - name: Publish failure log
        if: steps.size.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-size.log size

      - name: Fail the job
        if: steps.size.outcome == 'failure'
        shell: bash
        run: exit 1
