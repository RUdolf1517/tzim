name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features 2>&1 | tee "/tmp/tzim-test-${{ matrix.os }}.log"

      - name: Publish failure log
        if: steps.test.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh "/tmp/tzim-test-${{ matrix.os }}.log" "test-${{ matrix.os }}"

      - name: Fail the job
        if: steps.test.outcome == 'failure'
        shell: bash
        run: exit 1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/tzim-clippy.log

      - name: Publish failure log
        if: steps.clippy.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-clippy.log clippy

      - name: Fail the job
        if: steps.clippy.outcome == 'failure'
        shell: bash
        run: exit 1

  size:
    name: binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        id: size
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # Default features only, which is what a release ships: `--all-features`
          # would compile the fuzz entry points into the measured binary.
          cargo build --release --target x86_64-unknown-linux-musl 2>&1 | tee /tmp/tzim-size.log
          ls -l target/x86_64-unknown-linux-musl/release/tzim
          file target/x86_64-unknown-linux-musl/release/tzim
          bytes=$(stat -c '%s' target/x86_64-unknown-linux-musl/release/tzim)
          echo "$bytes" > /tmp/tzim-size-bytes.txt
          # Keep the shipping binary: the matrix below overwrites the path.
          cp target/x86_64-unknown-linux-musl/release/tzim /tmp/tzim-full
          # docs/size-budget.md 1: measured 900 KiB + 15 %.
          budget=1060864
          echo "bytes: $bytes, budget: $budget"
          test "$bytes" -le "$budget" || {
            echo "the static binary is $((bytes / 1024)) KiB, over the $((budget / 1024)) KiB budget" >&2
            exit 1
          }

      # What each handler costs. Measured, not inferred: the numbers in
      # docs/size-budget.md come from this table.
      - name: Feature matrix
        id: matrix
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          out=/tmp/tzim-features.txt
          printf '%-38s %10s %8s\n' "features" "bytes" "KiB" > "$out"
          printf '%-38s %10s %8s\n' "--------------------------------------" "----------" "--------" >> "$out"
          for features in \
            "png" \
            "png,gzip" \
            "png,gzip,zip" \
            "png,gzip,zip,ico" \
            "png,gzip,zip,ico,jpeg" \
            "png,gzip,zip,ico,jpeg,tiff" \
            "png,gzip,zip,ico,jpeg,tiff,zopfli"
          do
            cargo build --release --target x86_64-unknown-linux-musl \
              --no-default-features --features "$features" 2>&1 | tail -2
            bytes=$(stat -c '%s' target/x86_64-unknown-linux-musl/release/tzim)
            printf '%-38s %10s %8s\n' "$features" "$bytes" "$((bytes / 1024))" >> "$out"
          done
          cat "$out"

      - name: Report size
        if: steps.size.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            bytes=$(cat /tmp/tzim-size-bytes.txt)
            deps=$(cargo tree --edges normal --prefix none | sed 's/ (\*)//' | sort -u | wc -l)
            echo "static musl binary: ${bytes} bytes ($((bytes / 1024)) KiB)"
            echo "normal dependency lines: ${deps}"
            echo
            echo "feature builds:"
            cat /tmp/tzim-features.txt 2>/dev/null || echo "(the matrix step did not run)"
            echo
            echo "sections:"
            llvm-size -A /tmp/tzim-full 2>/dev/null | head -12 || true
          } | tee /tmp/tzim-size-report.txt
          bash .github/scripts/ci-report.sh /tmp/tzim-size-report.txt size report

      - name: Publish failure log
        if: steps.size.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci-report.sh /tmp/tzim-size.log size

      - name: Fail the job
        if: steps.size.outcome == 'failure'
        shell: bash
        run: exit 1
