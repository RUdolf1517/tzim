name: fits-heasarc

# Manual dispatch can run the exact-SHA end-to-end path: this HEASARC gate,
# the measurement workflow, and one bundle. Other workflows can call just this
# gate through `workflow_call`; pull requests start with the additive residual
# rows, then the full scope can be dispatched against that same PR-head SHA.
#
# This is a release gate, not a required merge check. It is not allowed to be
# quiet: there is no `continue-on-error` anywhere in it, and a tool that cannot
# be built, a warning from `fitsverify` or a header that does not diff clean
# fails the run.
#
# The tools are built from one archive whose SHA-256 is pinned below, so the
# provenance of the verifier is a hash and not a package manager's mood:
# `fitsverify`, `fpack` and `funpack` are targets of CFITSIO's own build
# (`utilities/`), and the CFITSIO commit is the same one the audit's corpus
# pins. The conda-forge route is recorded as the alternative and is not used —
# see the `HEASARC_NOTE` step.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA for both final-SHA gates and the evidence bundle.
        required: true
        type: string
      pull_request_head_sha:
        description: Optional PR source SHA to bind a full exact-head rerun to its residual PR run.
        required: false
        type: string
      bundle:
        description: Also run the measurement gate and create the final-SHA evidence bundle.
        required: false
        default: true
        type: boolean
      scope:
        description: Full gate or only new residual #78 rows.
        required: false
        default: full
        type: choice
        options:
          - full
          - residual
  workflow_call:
    inputs:
      sha:
        description: Exact commit to check out for the final-SHA gate.
        required: true
        type: string
      pull_request_head_sha:
        description: Optional PR source SHA to bind a full exact-head rerun to its residual PR run.
        required: false
        type: string
      bundle:
        description: Also run measurement and evidence bundling from a caller.
        required: false
        default: false
        type: boolean
      scope:
        description: Full gate or only new residual #78 rows.
        required: false
        default: full
        type: string
    outputs:
      requested_sha:
        description: SHA requested by the caller.
        value: ${{ jobs.heasarc.outputs.requested_sha }}
      checked_out_sha:
        description: SHA actually checked out by the gate.
        value: ${{ jobs.heasarc.outputs.checked_out_sha }}
      pull_request_head_sha:
        description: PR source SHA from the event or an explicitly bound exact-head rerun.
        value: ${{ jobs.heasarc.outputs.pull_request_head_sha }}
      result:
        description: The original HEASARC gate job result.
        value: ${{ jobs.heasarc.outputs.gate_result }}
  pull_request:
    paths:
      - "src/formats/fits.rs"
      - "tests/integration.rs"
      - "tests/common/mod.rs"
      - ".github/scripts/fits-heasarc.py"
      - ".github/scripts/test_fits_heasarc.py"
      - ".github/scripts/evidence-bundle.py"
      - ".github/scripts/test_evidence_bundle.py"
      - ".github/workflows/fits-heasarc.yml"

permissions:
  contents: read
  # `ci-report.sh` publishes the failing log as a pull-request comment; a
  # job-level `permissions` block replaces this one rather than adding to it.
  pull-requests: write

env:
  CARGO_TERM_COLOR: never
  # Pinned provenance. The SHA-256 values were computed from the archives this
  # workflow downloads; the feedstock identity is what the alternative route
  # would have installed.
  CFITSIO_COMMIT: "113781d8aa442cf8d3c27295d9084674b8b039f2"
  CFITSIO_SHA256: "d93c0de372a264156d2f3e1eab2d4159e132c35c2216f71c0af0009b92a72b5e"
  FITSVERIFY_FEEDSTOCK_COMMIT: "dc6109b2629c8e24c51ca7d2f042060a87fdd1f8"
  FITSVERIFY_FEEDSTOCK_VERSION: "4.22"
  FITSVERIFY_FEEDSTOCK_SHA256: "6c45e803a7e0edbcb7d13918615bae6361d2b333c292b849c509ec9bebdb18b4"
  ASTROPY_COMMIT: "dbbf2acd6dbb177db184bff319d2a2950dd178bb"
  ASTROPY_ARCHIVE_SHA256: "3c6b762797ea8f292d5c35fbb3ebe82b7a28139783b5c6e870a38e576d62a46f"
  ASTROPY_DOUBLE_EXT_SHA256: "7ab105b7695dbebd7da0bf430f58527b0da8223ea990460d22593c543f757bfc"

jobs:
  heasarc:
    name: fitsverify gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      requested_sha: ${{ steps.identity.outputs.requested_sha }}
      checked_out_sha: ${{ steps.identity.outputs.checked_out_sha }}
      pull_request_head_sha: ${{ steps.identity.outputs.pull_request_head_sha }}
      gate_result: ${{ steps.gate_outcome.outputs.result }}
    env:
      REQUESTED_SHA: ${{ inputs.sha || github.sha }}
      PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.pull_request_head_sha || '' }}
      FITS_HEASARC_SCOPE: ${{ inputs.scope || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact run identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          requested="${REQUESTED_SHA,,}"
          checked_out="$(git rev-parse HEAD)"
          pull_request_head="${PULL_REQUEST_HEAD_SHA,,}"
          checked_out_parents="$(git show -s --format=%P "$checked_out")"
          echo "REQUESTED_SHA=$requested" >> "$GITHUB_ENV"
          echo "CHECKED_OUT_SHA=$checked_out" >> "$GITHUB_ENV"
          echo "PULL_REQUEST_HEAD_SHA=$pull_request_head" >> "$GITHUB_ENV"
          echo "CHECKED_OUT_PARENTS=$checked_out_parents" >> "$GITHUB_ENV"
          echo "requested_sha=$requested" >> "$GITHUB_OUTPUT"
          echo "checked_out_sha=$checked_out" >> "$GITHUB_OUTPUT"
          echo "pull_request_head_sha=$pull_request_head" >> "$GITHUB_OUTPUT"
          mkdir -p "${RUNNER_TEMP}/evidence"
          {
            echo "requested SHA (test-merge SHA for PR events): $requested"
            echo "checked-out SHA: $checked_out"
            echo "checked-out parents: $checked_out_parents"
            echo "pull request head SHA: ${pull_request_head:-}"
            echo "event name: ${GITHUB_EVENT_NAME}"
            echo "run ID: ${GITHUB_RUN_ID}"
            echo "run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } | tee "${RUNNER_TEMP}/evidence/run-identity.txt"
          python3 - "$requested" "$checked_out" "$pull_request_head" "$checked_out_parents" > "${RUNNER_TEMP}/evidence/run-identity.json" <<'PY'
          import json
          import os
          import sys

          requested, checked_out, pull_request_head, parents = sys.argv[1:]
          parent_shas = parents.split()
          event_name = os.environ["GITHUB_EVENT_NAME"]
          head_is_parent = pull_request_head in parent_shas if event_name == "pull_request" else None
          head_is_checked_out = pull_request_head == checked_out if pull_request_head else None
          exact_sha_match = requested == checked_out
          source_identity_valid = exact_sha_match and (
              head_is_parent if event_name == "pull_request"
              else head_is_checked_out if pull_request_head
              else True
          )
          print(json.dumps({
              "requested_sha": requested,
              "checked_out_sha": checked_out,
              "requested_sha_matches_checkout": exact_sha_match,
              "checked_out_parents": parent_shas,
              "pull_request_head_sha": pull_request_head,
              "pull_request_head_is_parent": head_is_parent,
              "pull_request_head_is_checked_out": head_is_checked_out,
              "source_identity_valid": source_identity_valid,
              "event_name": event_name,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": "%s/%s/actions/runs/%s" % (
                  os.environ["GITHUB_SERVER_URL"],
                  os.environ["GITHUB_REPOSITORY"],
                  os.environ["GITHUB_RUN_ID"],
              ),
          }, indent=2, sort_keys=True))
          PY
          if [ "$requested" != "$checked_out" ]; then
            echo "::error::requested SHA does not match the checked-out commit"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ -z "$pull_request_head" ]; then
              echo "::error::pull-request head SHA is missing"
              exit 1
            fi
            case " $checked_out_parents " in
              *" $pull_request_head "*) ;;
              *)
                echo "::error::PR head $pull_request_head is not a parent of checked-out test merge $checked_out"
                exit 1
                ;;
            esac
          elif [ -n "$pull_request_head" ] && [ "$pull_request_head" != "$checked_out" ]; then
            echo "::error::a non-PR exact-head rerun must check out the recorded PR head SHA"
            exit 1
          fi

      - name: Select exact-SHA FITS evidence scope
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          REQUESTED_SCOPE: ${{ inputs.scope || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ -z "$PR_BASE_SHA" ]; then
              echo "::error::pull-request base SHA is missing"
              exit 2
            fi
            # Every PR head gets the additive residual first. After it passes,
            # dispatch the full scope against that exact PR-head SHA.
            scope=residual
          else
            scope="${REQUESTED_SCOPE:-full}"
          fi
          case "$scope" in
            full|residual) ;;
            *) echo "::error::unknown FITS evidence scope: $scope"; exit 2 ;;
          esac
          echo "FITS_HEASARC_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "FITS exact-SHA gate scope: $scope"

      - uses: dtolnay/rust-toolchain@stable

      - name: Record Rust compiler identity
        shell: bash
        run: |
          set -euo pipefail
          {
            rustc -Vv
            cargo -V
          } | tee "${RUNNER_TEMP}/evidence/rust-toolchain.txt"

      - name: Record the provenance of the tools
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence"
          {
            echo "cfitsio archive: https://codeload.github.com/heasarc/cfitsio/tar.gz/${CFITSIO_COMMIT}"
            echo "cfitsio archive sha256: ${CFITSIO_SHA256}"
            echo "fitsverify, fpack and funpack are targets of that archive's build (utilities/)."
            echo "alternative route not used: conda-forge fitsverify ${FITSVERIFY_FEEDSTOCK_VERSION}"
            echo "  feedstock commit: ${FITSVERIFY_FEEDSTOCK_COMMIT}"
            echo "  upstream tarball sha256 recorded there: ${FITSVERIFY_FEEDSTOCK_SHA256}"
            echo "  reason: it needs two archives instead of one, and the CFITSIO build"
            echo "  produces all three tools from the commit the corpus already pins."
          } | tee "${RUNNER_TEMP}/evidence/provenance.txt"

      - name: Run the gate's controlled-refusal regression tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s .github/scripts -p 'test_fits_heasarc.py' -v 2>&1 \
            | tee "${RUNNER_TEMP}/fits-gate-regressions.log"
          status=${PIPESTATUS[0]}
          set -e
          cp "${RUNNER_TEMP}/fits-gate-regressions.log" "${RUNNER_TEMP}/evidence/"
          echo "test exit: ${status}" | tee -a "${RUNNER_TEMP}/evidence/fits-gate-regressions.log"
          exit "$status"

      - name: Test the deterministic final-SHA bundle builder
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_evidence_bundle.py' -v 2>&1 \
            | tee "${RUNNER_TEMP}/evidence/evidence-bundle-tests.log"

      - name: Fetch the pinned archive and verify its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          url="https://codeload.github.com/heasarc/cfitsio/tar.gz/${CFITSIO_COMMIT}"
          curl -fsSL --retry 3 --retry-delay 2 -o "${RUNNER_TEMP}/cfitsio.tar.gz" "$url"
          echo "${CFITSIO_SHA256}  ${RUNNER_TEMP}/cfitsio.tar.gz" | sha256sum -c --strict -
          sha256sum "${RUNNER_TEMP}/cfitsio.tar.gz" | tee "${RUNNER_TEMP}/evidence/cfitsio-archive.txt"

      - name: Build fitsverify, fpack and funpack
        shell: bash
        run: |
          set -euo pipefail
          # Everything this step prints also lands in the log `ci-report.sh`
          # relays, because a build failure that leaves the gate unrun is exactly
          # the case where the artifact cannot be inspected.
          exec > >(tee -a "${RUNNER_TEMP}/fits-heasarc.log") 2>&1
          set -x
          # `set -e` alone leaves a bare "exit code 1" behind; the trap names the
          # line and the command, and an `::error::` becomes a check annotation,
          # which is readable even when neither the log nor the artifact is.
          trap 'echo "::error::build step failed at line ${LINENO}: ${BASH_COMMAND}"' ERR
          cd "${RUNNER_TEMP}"
          tar xzf cfitsio.tar.gz
          src="$(find . -maxdepth 1 -type d -name 'cfitsio-*' | head -1)"
          cd "$src"
          prefix="${RUNNER_TEMP}/cfitsio-install"
          ./configure --prefix="$prefix" > configure.log
          make -j"$(nproc)" > build.log 2>&1
          make install > install.log 2>&1

          # These programs are linked through libtool, so what `make` leaves at the
          # top of the tree — `fpack`, `funpack`, `fitsverify` — is a **wrapper
          # script**, and the programs themselves are in the `.libs` directories.
          # Copying the wrapper installed a script whose exec path did not survive,
          # which is how the first run got `funpack exited 255` and a toolchain
          # control that never fired. Take the real binaries, insist they are ELF,
          # and put the freshly built library on the loader path.
          bindir="$prefix/bin"
          mkdir -p "$bindir"
          for tool in fitsverify fpack funpack; do
            placed=""
            for candidate in "$bindir/$tool" "utilities/.libs/$tool" ".libs/$tool"; do
              # No `file … | grep -q` here: under `pipefail` a `grep -q` that exits
              # on the first match can kill `file` with SIGPIPE and make the test
              # fail on a file that is perfectly good.
              [ -f "$candidate" ] || continue
              kind="$(file -b "$candidate" 2>/dev/null || true)"
              case "$kind" in
                *ELF*)
                  # `make install` often puts the real binary in place already;
                  # copying a file onto itself fails under `set -e`.
                  if [ "$candidate" != "$bindir/$tool" ]; then
                    cp -f "$candidate" "$bindir/$tool"
                  fi
                  placed="$candidate"
                  break
                  ;;
              esac
            done
            if [ -z "$placed" ]; then
              echo "::error::$tool was not built as an executable (libtool wrapper only)"
              for where in "$bindir/$tool" "$tool" utilities/.libs "$tool" ".libs/$tool"; do
                [ -e "$where" ] && ls -l "$where"
              done || true
              exit 1
            fi
            chmod +x "$bindir/$tool"
            echo "$tool <- $placed: $(file -b "$bindir/$tool")"
          done
          echo "$bindir" >> "$GITHUB_PATH"
          # The library the tools just linked against; without it the loader finds
          # nothing and every tool exits before printing a thing.
          echo "LD_LIBRARY_PATH=$prefix/lib:${RUNNER_TEMP}/cfitsio-install/lib" >> "$GITHUB_ENV"
          ldd "$bindir/fpack" || true
          # The build logs are evidence: a verifier built from a patched tree is
          # not the verifier the audit names.
          cp configure.log build.log install.log "${RUNNER_TEMP}/evidence/"

      - name: Show what was built
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== which =="
            command -v fitsverify fpack funpack
            echo "== versions =="
            # `fitsverify` exits with the number of errors plus warnings, and its
            # usage text is not guaranteed to exit 0; the code is recorded and
            # not asserted here. The harness makes the same distinction.
            for tool in fitsverify fpack funpack; do
              echo "--- $tool"
              set +e
              output="$("$tool" 2>&1)"
              code=$?
              set -e
              printf '%s\n' "$output" | sed -n '1,4p'
              echo "exit: $code"
            done
          } | tee "${RUNNER_TEMP}/evidence/tool-versions.txt"

      - name: Fetch and verify the external Astropy EXTNAMX fixture
        if: steps.scope.outputs.scope == 'full'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/astropy-${ASTROPY_COMMIT}.tar.gz"
          source="${RUNNER_TEMP}/astropy-double-ext.fits"
          url="https://codeload.github.com/astropy/astropy/tar.gz/${ASTROPY_COMMIT}"
          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" "$url"
          echo "${ASTROPY_ARCHIVE_SHA256}  ${archive}" | sha256sum -c --strict -
          python3 - "$archive" "$source" <<'PY' | tee "${RUNNER_TEMP}/evidence/astropy-double-ext-provenance.txt"
          import hashlib
          import os
          import sys
          import tarfile

          archive, destination = sys.argv[1:]
          expected = "astropy/io/fits/tests/data/double_ext.fits"
          with tarfile.open(archive, "r:gz") as tar:
              matches = [member for member in tar.getmembers()
                         if member.isfile() and member.name.endswith("/" + expected)]
              if len(matches) != 1:
                  raise SystemExit("expected exactly one %s in the pinned Astropy archive, got %d"
                                   % (expected, len(matches)))
              data = tar.extractfile(matches[0]).read()
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != 11520 or digest != os.environ["ASTROPY_DOUBLE_EXT_SHA256"]:
              raise SystemExit("external double_ext fixture identity mismatch: %d bytes, %s"
                               % (len(data), digest))
          with open(destination, "wb") as handle:
              handle.write(data)
          print("archive URL: https://codeload.github.com/astropy/astropy/tar.gz/%s"
                % os.environ["ASTROPY_COMMIT"])
          print("archive SHA-256: %s" % os.environ["ASTROPY_ARCHIVE_SHA256"])
          print("member: %s" % expected)
          print("member bytes: %d" % len(data))
          print("member SHA-256: %s" % digest)
          PY
          sha256sum "$archive" "$source" | tee -a "${RUNNER_TEMP}/evidence/astropy-double-ext-provenance.txt"

      - name: Build tzim with the fits feature
        shell: bash
        run: cargo build --release --locked --features fits

      - name: Run the HEASARC gate
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --binary target/release/tzim
            --work "${RUNNER_TEMP}/fits-heasarc-work"
            --evidence "${RUNNER_TEMP}/evidence"
            --scope "$FITS_HEASARC_SCOPE"
          )
          if [ "$FITS_HEASARC_SCOPE" = "full" ]; then
            args+=(--external-double-ext "${RUNNER_TEMP}/astropy-double-ext.fits")
          fi
          python3 .github/scripts/fits-heasarc.py "${args[@]}" 2>&1 \
            | tee "${RUNNER_TEMP}/fits-heasarc.log"

      - name: Seal the evidence
        if: always()
        shell: bash
        run: |
          dir="${RUNNER_TEMP}/evidence"
          mkdir -p "$dir"
          if [ -f "$dir/checksums.txt" ]; then
            echo "the harness sealed its own evidence; see checksums.txt"
          else
            echo "the harness did not reach its seal step; sealing what exists"
            ( cd "$dir" && sha256sum * 2>/dev/null | grep -v ' checksums.txt$' > checksums.txt || true )
          fi
          {
            echo "requested SHA (test-merge SHA for PR events): ${REQUESTED_SHA:-unknown}"
            echo "checked-out SHA: ${CHECKED_OUT_SHA:-unknown}"
            echo "checked-out parents: ${CHECKED_OUT_PARENTS:-}"
            echo "pull request head SHA: ${PULL_REQUEST_HEAD_SHA:-}"
            echo "run ID: ${GITHUB_RUN_ID}"
            echo "run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "evidence scope: ${FITS_HEASARC_SCOPE:-unknown}"
            echo "run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$dir/run.txt"
          ( cd "$dir" && find . -type f ! -name workflow-SHA256SUMS -print0 | sort -z | \
              xargs -0 sha256sum > workflow-SHA256SUMS )
          cat "$dir/workflow-SHA256SUMS"

      - name: Step summary
        if: always()
        shell: bash
        run: |
          summary="${RUNNER_TEMP}/evidence/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The gate did not produce a summary; see the log and the artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish failure log
        # Not `continue-on-error`: the step below already ran, the job is going
        # to be red either way, and this only makes the reason readable.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/fits-heasarc.log"
          report="${RUNNER_TEMP}/fits-heasarc-report.log"
          diagnostics="${RUNNER_TEMP}/evidence/ci-diagnostics.md"
          if [ -s "$diagnostics" ]; then
            cp "$diagnostics" "$report"
            mode=full
          else
            if [ ! -s "$log" ]; then
              echo "no gate log was produced; the failure is in an earlier step" > "$log"
            fi
            cp "$log" "$report"
            mode=tail
          fi
          bash .github/scripts/ci-report.sh "$report" fits-heasarc failure "$mode"
          bytes=$(wc -c < "$report")
          echo "relayed ${bytes} bytes to the pull request"

      - name: Capture gate result for caller
        if: always()
        id: gate_outcome
        shell: bash
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fits-heasarc-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/fits-heasarc.log

  measurement:
    name: measurement reproducibility gate
    if: ${{ inputs.bundle && inputs.scope != 'residual' }}
    uses: ./.github/workflows/measure-repro.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
    secrets: inherit

  bundle:
    name: build and verify final-SHA evidence bundle
    if: ${{ always() && inputs.bundle && inputs.scope != 'residual' }}
    needs: [heasarc, measurement]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Record bundle-run identity
        id: identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_SHA,,}"
          checked_out="$(git rev-parse HEAD)"
          mkdir -p evidence-inputs evidence-output
          echo "requested_sha=$requested" >> "$GITHUB_OUTPUT"
          echo "checked_out_sha=$checked_out" >> "$GITHUB_OUTPUT"
          python3 - "$requested" "$checked_out" > evidence-output/bundle-run-identity.json <<'PY'
          import json
          import os
          import sys

          requested, checked_out = sys.argv[1:]
          print(json.dumps({
              "requested_sha": requested,
              "checked_out_sha": checked_out,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": "%s/%s/actions/runs/%s" % (
                  os.environ["GITHUB_SERVER_URL"],
                  os.environ["GITHUB_REPOSITORY"],
                  os.environ["GITHUB_RUN_ID"],
              ),
          }, indent=2, sort_keys=True))
          PY

      - name: Download both gate evidence artifacts
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-evidence"
          path: evidence-inputs
          merge-multiple: false

      - name: Build and internally verify the evidence bundle
        if: always()
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.sha }}
          HEASARC_RESULT: ${{ needs.heasarc.result }}
          MEASUREMENT_RESULT: ${{ needs.measurement.result }}
          HEASARC_REQUESTED_SHA: ${{ needs.heasarc.outputs.requested_sha }}
          HEASARC_CHECKED_OUT_SHA: ${{ needs.heasarc.outputs.checked_out_sha }}
          MEASUREMENT_REQUESTED_SHA: ${{ needs.measurement.outputs.requested_sha }}
          MEASUREMENT_CHECKED_OUT_SHA: ${{ needs.measurement.outputs.checked_out_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/evidence-bundle.py \
            --input-root evidence-inputs \
            --source-root "$GITHUB_WORKSPACE" \
            --output-dir evidence-output \
            --repository "$GITHUB_REPOSITORY" \
            --requested-sha "$REQUESTED_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --heasarc-result "$HEASARC_RESULT" \
            --measurement-result "$MEASUREMENT_RESULT" \
            --heasarc-requested-sha "$HEASARC_REQUESTED_SHA" \
            --heasarc-checked-out-sha "$HEASARC_CHECKED_OUT_SHA" \
            --measurement-requested-sha "$MEASUREMENT_REQUESTED_SHA" \
            --measurement-checked-out-sha "$MEASUREMENT_CHECKED_OUT_SHA"

      - name: Keep the overall run failed if either gate failed
        if: always()
        shell: bash
        env:
          HEASARC_RESULT: ${{ needs.heasarc.result }}
          MEASUREMENT_RESULT: ${{ needs.measurement.result }}
        run: |
          set -euo pipefail
          if [ "$HEASARC_RESULT" != "success" ] || [ "$MEASUREMENT_RESULT" != "success" ]; then
            echo "::error::final-SHA gates are not both successful (HEASARC=$HEASARC_RESULT, measurement=$MEASUREMENT_RESULT)"
            exit 1
          fi

      - name: Add bundle summary
        if: always()
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.sha }}
          BUNDLE_CHECKED_OUT_SHA: ${{ steps.identity.outputs.checked_out_sha }}
          HEASARC_RESULT: ${{ needs.heasarc.result }}
          MEASUREMENT_RESULT: ${{ needs.measurement.result }}
        run: |
          {
            echo "### Final-SHA evidence bundle"
            echo ""
            echo "- Requested SHA: ${REQUESTED_SHA}"
            echo "- Bundle checkout SHA: ${BUNDLE_CHECKED_OUT_SHA}"
            echo "- HEASARC gate: **${HEASARC_RESULT}**"
            echo "- Measurement gate: **${MEASUREMENT_RESULT}**"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            if [ -f evidence-output/bundle-self-check.txt ]; then
              cat evidence-output/bundle-self-check.txt
            else
              echo "Bundle creation did not finish; inspect job logs and gate artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the final-SHA evidence bundle and sidecars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-sha-evidence-bundle
          path: evidence-output
          retention-days: 90
          if-no-files-found: error
