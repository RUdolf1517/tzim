name: fits-heasarc

# The gate `docs/fits-audit.md` §8.3 and `docs/guarantees.md` §4.12 both name and
# neither has run: `fitsverify` and `funpack` are HEASARC's own tools, and no
# candidate produced by this program has ever been read by them (#71).
#
# This job is deliberately **not** a merge requirement yet: it is a release
# gate, and a required check that has never been green is the failure mode #68
# exists to prevent. It is also not allowed to be *quiet*: there is no
# `continue-on-error` anywhere in it, and a tool that cannot be built, a warning
# from `fitsverify` or a header that does not diff clean fails the run.
#
# The tools are built from one archive whose SHA-256 is pinned below, so the
# provenance of the verifier is a hash and not a package manager's mood:
# `fitsverify`, `fpack` and `funpack` are targets of CFITSIO's own build
# (`utilities/`), and the CFITSIO commit is the same one the audit's corpus
# pins. The conda-forge route is recorded as the alternative and is not used —
# see the `HEASARC_NOTE` step.

on:
  pull_request:
    paths:
      - "src/formats/fits.rs"
      - "tests/integration.rs"
      - "tests/common/mod.rs"
      - ".github/scripts/fits-heasarc.py"
      - ".github/workflows/fits-heasarc.yml"
  workflow_dispatch:

permissions:
  contents: read
  # `ci-report.sh` publishes the failing log as a pull-request comment; a
  # job-level `permissions` block replaces this one rather than adding to it.
  pull-requests: write

env:
  CARGO_TERM_COLOR: never
  # Pinned provenance. The SHA-256 values were computed from the archives this
  # workflow downloads; the feedstock identity is what the alternative route
  # would have installed.
  CFITSIO_COMMIT: "113781d8aa442cf8d3c27295d9084674b8b039f2"
  CFITSIO_SHA256: "d93c0de372a264156d2f3e1eab2d4159e132c35c2216f71c0af0009b92a72b5e"
  FITSVERIFY_FEEDSTOCK_COMMIT: "dc6109b2629c8e24c51ca7d2f042060a87fdd1f8"
  FITSVERIFY_FEEDSTOCK_VERSION: "4.22"
  FITSVERIFY_FEEDSTOCK_SHA256: "6c45e803a7e0edbcb7d13918615bae6361d2b333c292b849c509ec9bebdb18b4"
  ASTROPY_COMMIT: "dbbf2acd6dbb177db184bff319d2a2950dd178bb"
  ASTROPY_ARCHIVE_SHA256: "3c6b762797ea8f292d5c35fbb3ebe82b7a28139783b5c6e870a38e576d62a46f"
  ASTROPY_DOUBLE_EXT_SHA256: "7ab105b7695dbebd7da0bf430f58527b0da8223ea990460d22593c543f757bfc"

jobs:
  heasarc:
    name: fitsverify gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Record the provenance of the tools
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence"
          {
            echo "cfitsio archive: https://codeload.github.com/heasarc/cfitsio/tar.gz/${CFITSIO_COMMIT}"
            echo "cfitsio archive sha256: ${CFITSIO_SHA256}"
            echo "fitsverify, fpack and funpack are targets of that archive's build (utilities/)."
            echo "alternative route not used: conda-forge fitsverify ${FITSVERIFY_FEEDSTOCK_VERSION}"
            echo "  feedstock commit: ${FITSVERIFY_FEEDSTOCK_COMMIT}"
            echo "  upstream tarball sha256 recorded there: ${FITSVERIFY_FEEDSTOCK_SHA256}"
            echo "  reason: it needs two archives instead of one, and the CFITSIO build"
            echo "  produces all three tools from the commit the corpus already pins."
          } | tee "${RUNNER_TEMP}/evidence/provenance.txt"

      - name: Fetch the pinned archive and verify its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          url="https://codeload.github.com/heasarc/cfitsio/tar.gz/${CFITSIO_COMMIT}"
          curl -fsSL --retry 3 --retry-delay 2 -o "${RUNNER_TEMP}/cfitsio.tar.gz" "$url"
          echo "${CFITSIO_SHA256}  ${RUNNER_TEMP}/cfitsio.tar.gz" | sha256sum -c --strict -
          sha256sum "${RUNNER_TEMP}/cfitsio.tar.gz" | tee "${RUNNER_TEMP}/evidence/cfitsio-archive.txt"

      - name: Build fitsverify, fpack and funpack
        shell: bash
        run: |
          set -euo pipefail
          # Everything this step prints also lands in the log `ci-report.sh`
          # relays, because a build failure that leaves the gate unrun is exactly
          # the case where the artifact cannot be inspected.
          exec > >(tee -a "${RUNNER_TEMP}/fits-heasarc.log") 2>&1
          set -x
          # `set -e` alone leaves a bare "exit code 1" behind; the trap names the
          # line and the command, and an `::error::` becomes a check annotation,
          # which is readable even when neither the log nor the artifact is.
          trap 'echo "::error::build step failed at line ${LINENO}: ${BASH_COMMAND}"' ERR
          cd "${RUNNER_TEMP}"
          tar xzf cfitsio.tar.gz
          src="$(find . -maxdepth 1 -type d -name 'cfitsio-*' | head -1)"
          cd "$src"
          prefix="${RUNNER_TEMP}/cfitsio-install"
          ./configure --prefix="$prefix" > configure.log
          make -j"$(nproc)" > build.log 2>&1
          make install > install.log 2>&1

          # These programs are linked through libtool, so what `make` leaves at the
          # top of the tree — `fpack`, `funpack`, `fitsverify` — is a **wrapper
          # script**, and the programs themselves are in the `.libs` directories.
          # Copying the wrapper installed a script whose exec path did not survive,
          # which is how the first run got `funpack exited 255` and a toolchain
          # control that never fired. Take the real binaries, insist they are ELF,
          # and put the freshly built library on the loader path.
          bindir="$prefix/bin"
          mkdir -p "$bindir"
          for tool in fitsverify fpack funpack; do
            placed=""
            for candidate in "$bindir/$tool" "utilities/.libs/$tool" ".libs/$tool"; do
              # No `file … | grep -q` here: under `pipefail` a `grep -q` that exits
              # on the first match can kill `file` with SIGPIPE and make the test
              # fail on a file that is perfectly good.
              [ -f "$candidate" ] || continue
              kind="$(file -b "$candidate" 2>/dev/null || true)"
              case "$kind" in
                *ELF*)
                  # `make install` often puts the real binary in place already;
                  # copying a file onto itself fails under `set -e`.
                  if [ "$candidate" != "$bindir/$tool" ]; then
                    cp -f "$candidate" "$bindir/$tool"
                  fi
                  placed="$candidate"
                  break
                  ;;
              esac
            done
            if [ -z "$placed" ]; then
              echo "::error::$tool was not built as an executable (libtool wrapper only)"
              for where in "$bindir/$tool" "$tool" utilities/.libs "$tool" ".libs/$tool"; do
                [ -e "$where" ] && ls -l "$where"
              done || true
              exit 1
            fi
            chmod +x "$bindir/$tool"
            echo "$tool <- $placed: $(file -b "$bindir/$tool")"
          done
          echo "$bindir" >> "$GITHUB_PATH"
          # The library the tools just linked against; without it the loader finds
          # nothing and every tool exits before printing a thing.
          echo "LD_LIBRARY_PATH=$prefix/lib:${RUNNER_TEMP}/cfitsio-install/lib" >> "$GITHUB_ENV"
          ldd "$bindir/fpack" || true
          # The build logs are evidence: a verifier built from a patched tree is
          # not the verifier the audit names.
          cp configure.log build.log install.log "${RUNNER_TEMP}/evidence/"

      - name: Show what was built
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== which =="
            command -v fitsverify fpack funpack
            echo "== versions =="
            # `fitsverify` exits with the number of errors plus warnings, and its
            # usage text is not guaranteed to exit 0; the code is recorded and
            # not asserted here. The harness makes the same distinction.
            for tool in fitsverify fpack funpack; do
              echo "--- $tool"
              set +e
              output="$("$tool" 2>&1)"
              code=$?
              set -e
              printf '%s\n' "$output" | sed -n '1,4p'
              echo "exit: $code"
            done
          } | tee "${RUNNER_TEMP}/evidence/tool-versions.txt"

      - name: Fetch and verify the external Astropy EXTNAMX fixture
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/astropy-${ASTROPY_COMMIT}.tar.gz"
          source="${RUNNER_TEMP}/astropy-double-ext.fits"
          url="https://codeload.github.com/astropy/astropy/tar.gz/${ASTROPY_COMMIT}"
          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" "$url"
          echo "${ASTROPY_ARCHIVE_SHA256}  ${archive}" | sha256sum -c --strict -
          python3 - "$archive" "$source" <<'PY' | tee "${RUNNER_TEMP}/evidence/astropy-double-ext-provenance.txt"
          import hashlib
          import os
          import sys
          import tarfile

          archive, destination = sys.argv[1:]
          expected = "astropy/io/fits/tests/data/double_ext.fits"
          with tarfile.open(archive, "r:gz") as tar:
              matches = [member for member in tar.getmembers()
                         if member.isfile() and member.name.endswith("/" + expected)]
              if len(matches) != 1:
                  raise SystemExit("expected exactly one %s in the pinned Astropy archive, got %d"
                                   % (expected, len(matches)))
              data = tar.extractfile(matches[0]).read()
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != 11520 or digest != os.environ["ASTROPY_DOUBLE_EXT_SHA256"]:
              raise SystemExit("external double_ext fixture identity mismatch: %d bytes, %s"
                               % (len(data), digest))
          with open(destination, "wb") as handle:
              handle.write(data)
          print("archive URL: https://codeload.github.com/astropy/astropy/tar.gz/%s"
                % os.environ["ASTROPY_COMMIT"])
          print("archive SHA-256: %s" % os.environ["ASTROPY_ARCHIVE_SHA256"])
          print("member: %s" % expected)
          print("member bytes: %d" % len(data))
          print("member SHA-256: %s" % digest)
          PY
          sha256sum "$archive" "$source" | tee -a "${RUNNER_TEMP}/evidence/astropy-double-ext-provenance.txt"

      - name: Build tzim with the fits feature
        shell: bash
        run: cargo build --release --locked --features fits

      - name: Run the HEASARC gate
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/fits-heasarc.py \
            --binary target/release/tzim \
            --external-double-ext "${RUNNER_TEMP}/astropy-double-ext.fits" \
            --work "${RUNNER_TEMP}/fits-heasarc-work" \
            --evidence "${RUNNER_TEMP}/evidence" 2>&1 | tee "${RUNNER_TEMP}/fits-heasarc.log"

      - name: Seal the evidence
        if: always()
        shell: bash
        run: |
          dir="${RUNNER_TEMP}/evidence"
          mkdir -p "$dir"
          if [ -f "$dir/checksums.txt" ]; then
            echo "the harness sealed its own evidence; see checksums.txt"
          else
            echo "the harness did not reach its seal step; sealing what exists"
            ( cd "$dir" && sha256sum * 2>/dev/null | grep -v ' checksums.txt$' > checksums.txt || true )
          fi
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$dir/run.txt"
          sha256sum "$dir"/* | sed "s|$dir/||"

      - name: Step summary
        if: always()
        shell: bash
        run: |
          summary="${RUNNER_TEMP}/evidence/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The gate did not produce a summary; see the log and the artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish failure log
        # Not `continue-on-error`: the step below already ran, the job is going
        # to be red either way, and this only makes the reason readable.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/fits-heasarc.log"
          report="${RUNNER_TEMP}/fits-heasarc-report.log"
          diagnostics="${RUNNER_TEMP}/evidence/ci-diagnostics.md"
          if [ -s "$diagnostics" ]; then
            cp "$diagnostics" "$report"
            mode=full
          else
            if [ ! -s "$log" ]; then
              echo "no gate log was produced; the failure is in an earlier step" > "$log"
            fi
            cp "$log" "$report"
            mode=tail
          fi
          bash .github/scripts/ci-report.sh "$report" fits-heasarc failure "$mode"
          bytes=$(wc -c < "$report")
          echo "relayed ${bytes} bytes to the pull request"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fits-heasarc-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/fits-heasarc.log
