name: windows installer

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "packaging/windows/**"
      - "packaging/winget/**"
      - ".github/workflows/windows-installer.yml"
      - ".github/workflows/release.yml"
      - "README.md"
      - "docs/releases.md"
  pull_request:
    paths:
      - "packaging/windows/**"
      - "packaging/winget/**"
      - ".github/workflows/windows-installer.yml"
      - ".github/workflows/release.yml"
      - "README.md"
      - "docs/releases.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  windows-installer:
    name: install, upgrade, rollback, uninstall, and local winget
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Record Windows and winget environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Start-Transcript -Path artifacts\windows-environment-transcript.txt -Force | Out-Null
          try {
            "RUN_ID=$env:GITHUB_RUN_ID" | Set-Content -Path artifacts\run-identity.txt
            "RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT" | Add-Content -Path artifacts\run-identity.txt
            "HEAD_SHA=$env:GITHUB_SHA" | Add-Content -Path artifacts\run-identity.txt
            $PSVersionTable | Out-String | Tee-Object -FilePath artifacts\powershell-version.txt
            winget.exe --version 2>&1 | Tee-Object -FilePath artifacts\winget-version.txt
            if ($LASTEXITCODE -ne 0) { throw "winget --version failed with exit code $LASTEXITCODE" }
            python --version 2>&1 | Tee-Object -FilePath artifacts\python-version.txt
            if ($LASTEXITCODE -ne 0) { throw "python --version failed with exit code $LASTEXITCODE" }
          }
          finally {
            Stop-Transcript | Out-Null
          }

      - name: Run Windows installer integration and winget install
        shell: powershell
        env:
          TZIM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & .\packaging\windows\tests\Install.Integration.ps1
          }
          catch {
            $diagnostic = @(
              $_.Exception.ToString()
              "Category: $($_.CategoryInfo)"
              "Script stack: $($_.ScriptStackTrace)"
              "Position: $($_.InvocationInfo.PositionMessage)"
            ) -join [Environment]::NewLine
            [System.IO.File]::WriteAllText(
              'artifacts\windows-installer-error.txt',
              $diagnostic,
              [System.Text.UTF8Encoding]::new($false)
            )
            throw
          }

      - name: Publish Windows integration failure log to the pull request
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          log_file="$RUNNER_TEMP/windows-installer-failure.log"
          python - "$log_file" <<'PY'
          from pathlib import Path
          import sys

          target = Path(sys.argv[1])
          with target.open("w", encoding="utf-8") as output:
              for path in sorted(Path("artifacts").glob("*")):
                  if not path.is_file() or path.suffix.lower() not in {".txt", ".log"}:
                      continue
                  data = path.read_bytes()
                  if data.startswith((b"\xff\xfe", b"\xfe\xff")):
                      text = data.decode("utf-16")
                  else:
                      text = data.decode("utf-8", errors="replace")
                  output.write(f"\n--- {path.as_posix()} ---\n{text}\n")
          PY
          bash .github/scripts/ci-report.sh "$log_file" windows-installer

      - name: Summarize evidence location and run identity
        if: always()
        shell: powershell
        run: |
          @"
          ## Windows installer integration evidence

          - Run ID: $env:GITHUB_RUN_ID (attempt $env:GITHUB_RUN_ATTEMPT)
          - Exact head SHA: $env:GITHUB_SHA
          - Raw logs, downloaded release inputs, generated local winget manifests, and command outputs: artifact `windows-installer-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT`
          - The integration requires `winget validate --manifest` and a real `winget install --manifest`; no community source or publication is used.
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
