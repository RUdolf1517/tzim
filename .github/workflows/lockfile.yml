name: lockfile

# Writes Cargo.lock on a machine that has a Rust toolchain and network access,
# then commits it to the branch it was triggered by.
#
# It exists because the development environment for this project cannot run
# cargo: the lockfile has to be produced by CI rather than by the author's
# machine. That makes this job the only writer of Cargo.lock, which is why it
# runs on every branch and not only on `main` — a pull request that adds a
# dependency would otherwise arrive with a lock file that CI cannot honour under
# `--locked`.
#
# The push is made with the workflow token, so it does not trigger another
# workflow run. The commit is plain: `cargo generate-lockfile` is deterministic
# for a given set of version requirements, so the diff is reviewable.

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: write

# The same group as the `fmt` job in ci.yml: two jobs that push to the branch
# must not race for the same ref.
concurrency:
  group: branch-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Commit if it changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain Cargo.lock)" ]; then
            echo "Cargo.lock is already up to date"
            exit 0
          fi
          git config user.name "tzim ci"
          git config user.email "ci@tzim.invalid"
          git add Cargo.lock
          git commit -m "chore: Cargo.lock regenerated by CI"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
