name: lockfile

# Generates Cargo.lock on a machine that has a Rust toolchain and network access,
# then commits it. Run manually once, and again after dependency changes.
#
# It exists because the project's development sandbox cannot run cargo: the
# lockfile has to be produced by CI rather than by the author's machine.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain Cargo.lock)" ]; then
            echo "Cargo.lock is already up to date"
            exit 0
          fi
          git config user.name "tzim ci"
          git config user.email "ci@tzim.invalid"
          git add Cargo.lock
          git commit -m "chore: add Cargo.lock generated by the CI toolchain"
          git push
