name: release

# Builds the shipped artifacts. Triggered when a release is published, so the
# release notes can be written first; the binaries are attached to it a few
# minutes later. Nothing here is built by hand.
#
# Asset names are the Rust target triples and carry no version, which is what
# makes https://github.com/<repo>/releases/latest/download/<asset> a stable URL
# for install.sh. The .deb and .rpm are built here from the same tarball.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to build artifacts for
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tooling
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        # Default features: the fuzz entry points are not part of a release.
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/tzim"
          if [ -f "${bin}.exe" ]; then bin="${bin}.exe"; fi
          "$bin" --version
          "$bin" formats

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Stable, version-less names: releases/latest/download/<name> resolves
          # for every release, which is what install.sh and the formula use.
          name="tzim-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/tzim"
          mkdir -p dist

          if [ -f "${bin}.exe" ]; then
            cp "${bin}.exe" dist/tzim.exe
            (cd dist && 7z a "../${name}.zip" tzim.exe > /dev/null)
            asset="${name}.zip"
            rm -rf dist
          else
            cp "$bin" dist/tzim
            chmod +x dist/tzim
            (cd dist && tar czf "../${name}.tar.gz" tzim)
            asset="${name}.tar.gz"
            rm -rf dist
          fi

          echo "Built ${asset} ($(stat -c %s "$asset" 2>/dev/null || stat -f %z "$asset") bytes)"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Linux packages
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: bash packaging/linux-packages.sh "${TAG#v}" artifacts

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Annotate the checksums
        shell: bash
        run: |
          # Second channel on purpose: the notes are for people, the annotation
          # is reachable from the API, and a release is not something to redo
          # because a hash was not copyable.
          printf '::notice::'
          awk '{ if (NR > 1) printf "%s", "%0A"; printf "%s", $0 }' artifacts/SHA256SUMS
          printf '\n'

      - name: Publish the checksums in the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The hashes are also an asset, but an asset cannot be read from the
          # release page. Keeping one copy in the notes is what makes
          # "copy the SHA-256 into the formula" a one-minute job, and a second
          # run replaces the block instead of stacking another one.
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > body.md
          if grep -q '^### SHA-256$' body.md; then
            sed -i '/^### SHA-256$/,$d' body.md
          fi
          {
            cat body.md
            echo '### SHA-256'
            echo
            echo '```'
            cat artifacts/SHA256SUMS
            echo '```'
          } > notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
