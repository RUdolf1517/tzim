name: fuzz

# Smoke run of the cargo-fuzz targets in fuzz/. The targets live in their own
# workspace so that libfuzzer-sys and the sanitizer runtime never become
# dependencies of the binary.
#
# Sixty seconds per target on every pull request is a tripwire, not a proof. It
# catches the class of defect that a hand-written parser produces — an unchecked
# length, an index past a slice, an allocation sized by an attacker's number.
# Longer runs are done before a release.

on:
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - ".github/data/flac-corpus.json"
      - ".github/scripts/prepare_flac_fuzz_seeds.py"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "60"
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed corpus
        shell: bash
        run: |
          # Pinned PNG, JPEG, TIFF, zlib and FLAC fixtures give libFuzzer valid
          # structures to mutate instead of waiting for random bytes to reach a
          # deep branch. FLAC seeds are copied from a manifest-pinned CC0 testbench.
          work="${RUNNER_TEMP}/fuzz-seed"
          mkdir -p "$work"
          curl -fsSL -o "$work/libpng.tar.gz" \
            https://codeload.github.com/pnggroup/libpng/tar.gz/refs/tags/v1.6.44
          echo "0ef5b633d0c65f780c4fced27ff832998e71478c13b45dfb6e94f23a82f64f7c  $work/libpng.tar.gz" | sha256sum -c --quiet -
          curl -fsSL -o "$work/libjpeg-turbo.tar.gz" \
            https://codeload.github.com/libjpeg-turbo/libjpeg-turbo/tar.gz/refs/tags/3.1.0
          echo "35fec2e1ddfb05ecf6d93e50bc57c1e54bc81c16d611ddf6eff73fff266d8285  $work/libjpeg-turbo.tar.gz" | sha256sum -c --quiet -
          # Pillow's fixtures are the corpus's source of TIFFs, and the same
          # pinned archive seeds the tiff parser (#36).
          curl -fsSL -o "$work/pillow.tar.gz" \
            https://codeload.github.com/python-pillow/Pillow/tar.gz/refs/tags/11.3.0
          echo "fa4aca745b1e1c733589ebf0ef19491b145dd4225c4aa06958963b4e7f0734cf  $work/pillow.tar.gz" | sha256sum -c --quiet -
          tar xzf "$work/libpng.tar.gz" -C "$work"
          tar xzf "$work/libjpeg-turbo.tar.gz" -C "$work"
          tar xzf "$work/pillow.tar.gz" -C "$work"
          # `strip` gets the same images: it is the target that exercises the
          # `--strip-metadata` path, and it had no seeds at all (#36).
          mkdir -p fuzz/corpus/roundtrip fuzz/corpus/jpeg_decode fuzz/corpus/strip
          cp "$work"/libpng-1.6.44/contrib/pngsuite/*.png fuzz/corpus/roundtrip/
          cp "$work"/libjpeg-turbo-3.1.0/testimages/*.jpg fuzz/corpus/roundtrip/
          cp "$work"/libjpeg-turbo-3.1.0/testimages/*.jpg fuzz/corpus/jpeg_decode/
          cp "$work"/libpng-1.6.44/contrib/pngsuite/*.png fuzz/corpus/strip/
          cp "$work"/libjpeg-turbo-3.1.0/testimages/*.jpg fuzz/corpus/strip/
          # TIFF, from the same archive the corpus uses: without a seed the strip
          # scanner and the IFD reader are never reached (#36).
          mkdir -p fuzz/corpus/tiff
          find "$work/Pillow-11.3.0/Tests/images" -maxdepth 1 \
            \( -iname '*.tif' -o -iname '*.tiff' \) -size -2M \
            -exec cp {} fuzz/corpus/roundtrip/ \;
          find "$work/Pillow-11.3.0/Tests/images" -maxdepth 1 \
            \( -iname '*.tif' -o -iname '*.tiff' \) -size -2M \
            -exec cp {} fuzz/corpus/tiff/ \;
          cp fuzz/corpus/tiff/* fuzz/corpus/strip/ 2>/dev/null || true
          # zlib streams: four compression levels over a text payload and over a
          # PNG, so the header reader and the recompressor both get input.
          mkdir -p fuzz/corpus/zlib
          python3 - <<'PY'
          import zlib
          text = (b"tzim shrinks the file, never the information. " * 200)
          png = open("fuzz/corpus/roundtrip/basn2c08.png", "rb").read()
          for level in (0, 1, 6, 9):
              open(f"fuzz/corpus/zlib/text-{level}.zlib", "wb").write(zlib.compress(text, level))
              open(f"fuzz/corpus/zlib/png-{level}.zlib", "wb").write(zlib.compress(png, level))
          PY
          cp fuzz/corpus/zlib/* fuzz/corpus/roundtrip/
          cp fuzz/corpus/zlib/* fuzz/corpus/strip/
          # Build a deterministic one-page PDF whose eligible stream has room
          # for a FlateDecode rewrite; mutations then reach the xref/object parser
          # instead of starting with random bytes. This is a fuzz seed, not part
          # of the real-toolchain #57 measurement set.
          python3 - <<'PY'
          import zlib
          from pathlib import Path

          payload = b"q 1 0 0 1 0 0 cm Q\n" * 8000
          compressed = zlib.compress(payload, 1)
          objects = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 100 100] /Resources << >> /Contents 4 0 R >>",
              b"<< /Length " + str(len(compressed)).encode() + b" /Filter /FlateDecode >>\nstream\n"
              + compressed + b"\nendstream",
          ]
          pdf = bytearray(b"%PDF-1.4\n")
          offsets = [0]
          for number, body in enumerate(objects, start=1):
              offsets.append(len(pdf))
              pdf.extend(f"{number} 0 obj\n".encode())
              pdf.extend(body)
              pdf.extend(b"\nendobj\n")
          xref = len(pdf)
          pdf.extend(f"xref\n0 {len(offsets)}\n".encode())
          pdf.extend(b"0000000000 65535 f \n")
          for offset in offsets[1:]:
              pdf.extend(f"{offset:010d} 00000 n \n".encode())
          pdf.extend(f"trailer\n<< /Size {len(offsets)} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n".encode())
          for target in ("roundtrip", "strip"):
              Path(f"fuzz/corpus/{target}/seed-valid-flate.pdf").write_bytes(pdf)
          PY
          echo "seeds: $(find fuzz/corpus -type f | wc -l)"

      - name: Add fixed FLAC decoder-testbench seeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/prepare_flac_fuzz_seeds.py \
            --manifest .github/data/flac-corpus.json \
            --roundtrip-dir fuzz/corpus/roundtrip \
            --strip-dir fuzz/corpus/strip

      - name: Run targets
        shell: bash
        run: |
          seconds="${{ github.event.inputs.seconds || '60' }}"
          status=0
          for target in jpeg_decode roundtrip strip; do
            echo "::group::${target}, ${seconds}s"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time="$seconds" -print_final_stats=1 || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Keep findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          retention-days: 30
          if-no-files-found: warn
          path: |
            fuzz/artifacts/
            fuzz/corpus/
