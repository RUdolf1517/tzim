# cargo-deny configuration. The policy it enforces is docs/dependencies.md §5:
# a short allow-list of permissive licences, no unvetted sources, no surprise
# duplicates, and the RustSec advisory database.
#
# Every check runs in the `deny` job in .github/workflows/ci.yml. A failure
# there is a build failure, not a warning: the allow-list is the policy.

[graph]
# Optional and platform-specific dependencies are still dependencies: a crate
# compiled only on Windows is a crate whose licence and advisories we accept.
all-features = true

[advisories]
version = 2
# A yanked release is either a mistake or a security event. Neither is something
# to ship; `Cargo.lock` is regenerated by CI, so a yank shows up here and not in
# a user's build.
yanked = "deny"

[licenses]
version = 2
# The default threshold is 0.8, which guesses on files with partial licence
# text. 0.9 still reads the usual `LICENSE` file and stops guessing sooner.
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # `adler2`, the checksum inside `miniz_oxide`, is 0BSD OR MIT OR Apache-2.0.
    # Listed because a licence list that omits the option a crate actually uses
    # fails for the wrong reason.
    "0BSD",
    # `unicode-width`, if it ever comes back into the tree (docs/dependencies.md
    # §2.9 explains why it is not there now).
    "Unicode-3.0",
    # MPL-2.0 is file-level copyleft and compatible with static linking; it is
    # allowed deliberately, with a notice requirement, and nothing in the tree
    # uses it today.
    "MPL-2.0",
]

[bans]
# `miniz_oxide` appears twice (0.8.x through `flate2`, 0.9.x through `png`).
# Denying duplicates would fail on a fact about the ecosystem, not about our
# choices, so duplicates are reported but not fatal; anything new is visible in
# the job log.
multiple-versions = "warn"
# A wildcard dependency requirement means an uncontrolled version range.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
