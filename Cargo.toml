[package]
name = "tzim"
version = "0.13.0"
edition = "2021"
rust-version = "1.88"
description = "Lossless file optimizer: shrink the file, never the information"
license = "MIT"
repository = "https://github.com/RUdolf1517/tzim"
readme = "README.md"
keywords = ["lossless", "optimization", "png", "gzip", "jpeg"]
categories = ["command-line-utilities", "compression"]
# Audit records are history, not documentation the crate needs: keep them in the repository
# and out of the published package.
exclude = ["docs/audits/"]

[lib]
name = "tzim"
path = "src/lib.rs"

[[bin]]
name = "tzim"
path = "src/main.rs"

[dependencies]
crc32fast = { version = "1.5", optional = true }
flate2 = { version = "1.1", optional = true, default-features = false, features = ["rust_backend"] }
png = { version = "0.18", optional = true, default-features = false }
zopfli = { version = "0.8", optional = true, default-features = false, features = ["std"] }
# The independent JPEG decoder, used only to verify a candidate the way a third
# party would read it (docs/guarantees.md §2.6, issue #39). `rayon` is on by
# default and is turned off: a second thread pool in a tool that already has a
# worker pool is a cost with no benefit for one 8×8 block at a time.
# `platform_independent` drops the SIMD module, which is what makes the crate
# `forbid(unsafe_code)` instead of merely `deny`. docs/dependencies.md §2.10.
jpeg-decoder = { version = "0.3", optional = true, default-features = false, features = ["platform_independent"] }

[features]
# One feature per handler family, so a build can drop what it will never see.
# `default` is what the published binaries are built with.
default = ["png", "gzip", "zip", "ico", "jpeg", "tiff", "zlib", "zopfli"]
gzip = ["dep:flate2", "dep:crc32fast"]
png = ["dep:png", "dep:flate2", "dep:crc32fast"]
zip = ["dep:flate2", "dep:crc32fast"]
# ICO entries are either PNG images (which need the PNG handler) or bitmaps that
# are copied verbatim, so the feature is a thin layer over `png`.
ico = ["png"]
# The JPEG codec is part of this repository, so the handler costs nothing but the
# code it gates.
jpeg = []
# Verification of a JPEG candidate by an independent decoder, which closes the
# hole `guarantees.md` §2.6 names: a codec shared by the writer and the checker
# cannot catch a defect symmetric in itself.
#
# **Off by default, and the measurement is why.** #39 approved this on one
# condition — the shipping binary must not grow past 1 049 440 bytes, the v0.12.1
# measurement — and it does not fit, even with `indicatif`'s 96 KiB returned:
# `jpeg-decoder` costs more than that. Rather than grow the binary or break the
# condition, the feature exists, is tested in CI on every run, and is what
# `--all-features` and the `third-party` job exercise:
#
#     cargo build --release --features jpeg-v1
#
# `docs/dependencies.md` §2.10 and `docs/size-budget.md` §3 carry the numbers.
jpeg-v1 = ["jpeg", "dep:jpeg-decoder", "dep:crc32fast"]
# TIFF only needs the DEFLATE codec that PNG and gzip already bring in.
tiff = ["dep:flate2"]
# zlib streams (RFC 1950) are DEFLATE plus a two-byte header and an Adler-32
# trailer, and both of those are a few lines here, so this costs no crate.
zlib = ["dep:flate2"]
zopfli = ["dep:zopfli"]
# Exposes the parsers to the fuzz targets in fuzz/. Never enabled for a release.
fuzz-api = []

[profile.release]
# This crate is where the size can be bought: -Os keeps it about 10 % smaller
# for about 3 % on the real-file corpus. The dependencies stay at -O3, because
# that is where the CPU actually goes — shrinking them instead saved a quarter
# of the size and cost twice the speed (docs/size-budget.md §5).
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# The codecs are hot: DEFLATE, the PNG decoder, Zopfli. They are compiled at
# full optimization even though this crate is not.
[profile.release.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
