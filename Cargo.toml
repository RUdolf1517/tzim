[package]
name = "tzim"
version = "0.7.1"
edition = "2021"
rust-version = "1.88"
description = "Lossless file optimizer: shrink the file, never the information"
license = "MIT"
repository = "https://github.com/RUdolf1517/tzim"
readme = "README.md"
keywords = ["lossless", "optimization", "png", "gzip", "jpeg"]
categories = ["command-line-utilities", "compression"]

[lib]
name = "tzim"
path = "src/lib.rs"

[[bin]]
name = "tzim"
path = "src/main.rs"

[dependencies]
crc32fast = { version = "1.5", optional = true }
flate2 = { version = "1.1", optional = true, default-features = false, features = ["rust_backend"] }
png = { version = "0.18", optional = true, default-features = false }
zopfli = { version = "0.8", optional = true, default-features = false, features = ["std"] }

[features]
# One feature per handler family, so a build can drop what it will never see.
# `default` is what the published binaries are built with.
default = ["png", "gzip", "zip", "ico", "jpeg", "tiff", "zopfli"]
gzip = ["dep:flate2", "dep:crc32fast"]
png = ["dep:png", "dep:flate2", "dep:crc32fast"]
zip = ["dep:flate2", "dep:crc32fast"]
# ICO entries are either PNG images (which need the PNG handler) or bitmaps that
# are copied verbatim, so the feature is a thin layer over `png`.
ico = ["png"]
# The JPEG codec is part of this repository and pulls in no crate, so the
# feature costs nothing but the code it gates.
jpeg = []
# TIFF only needs the DEFLATE codec that PNG and gzip already bring in.
tiff = ["dep:flate2"]
zopfli = ["dep:zopfli"]
# Exposes the parsers to the fuzz targets in fuzz/. Never enabled for a release.
fuzz-api = []

[profile.release]
# This crate is where the size can be bought: -Os keeps it about 10 % smaller
# for about 3 % on the real-file corpus. The dependencies stay at -O3, because
# that is where the CPU actually goes — shrinking them instead saved a quarter
# of the size and cost twice the speed (docs/size-budget.md §5).
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# The codecs are hot: DEFLATE, the PNG decoder, Zopfli. They are compiled at
# full optimization even though this crate is not.
[profile.release.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
