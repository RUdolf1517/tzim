[package]
name = "tzim"
version = "0.14.0"
edition = "2021"
rust-version = "1.88"
description = "Lossless file optimizer: shrink the file, never the information"
license = "MIT"
repository = "https://github.com/RUdolf1517/tzim"
readme = "README.md"
keywords = ["lossless", "optimization", "png", "gzip", "jpeg"]
categories = ["command-line-utilities", "compression"]
# Audit records are history, not documentation the crate needs: keep them in the repository
# and out of the published package.
exclude = ["docs/audits/"]

[lib]
name = "tzim"
path = "src/lib.rs"

[[bin]]
name = "tzim"
path = "src/main.rs"

[dependencies]
crc32fast = { version = "1.5", optional = true }
flate2 = { version = "1.1", optional = true, default-features = false, features = ["rust_backend"] }
png = { version = "0.18", optional = true, default-features = false }
zopfli = { version = "0.8", optional = true, default-features = false, features = ["std"] }
# The independent JPEG decoder, used only to verify a candidate the way a third
# party would read it (docs/guarantees.md §2.6, issue #39). `rayon` is on by
# default and is turned off: a second thread pool in a tool that already has a
# worker pool is a cost with no benefit for one 8×8 block at a time.
# `platform_independent` drops the SIMD module, which is what makes the crate
# `forbid(unsafe_code)` instead of merely `deny`. docs/dependencies.md §2.10.
jpeg-decoder = { version = "0.3", optional = true, default-features = false, features = ["platform_independent"] }

[features]
# One feature per handler family, so a build can drop what it will never see.
# `default` is what the published binaries are built with.
default = ["png", "gzip", "zip", "ico", "jpeg-v1", "tiff", "zlib", "zopfli"]
gzip = ["dep:flate2", "dep:crc32fast"]
png = ["dep:png", "dep:flate2", "dep:crc32fast"]
zip = ["dep:flate2", "dep:crc32fast"]
# ICO entries are either PNG images (which need the PNG handler) or bitmaps that
# are copied verbatim, so the feature is a thin layer over `png`.
ico = ["png"]
# The JPEG codec is part of this repository, so the handler costs nothing but the
# code it gates.
jpeg = []
# Verification of a JPEG candidate by an independent decoder, closing the
# symmetric-codec hole in `guarantees.md` §2.6. The release default includes this
# feature and enables only the already-verified baseline subset; narrow a mixed
# run with `--formats` or build without defaults for a smaller binary.
jpeg-v1 = ["jpeg", "dep:jpeg-decoder", "dep:crc32fast"]
# TIFF only needs the DEFLATE codec that PNG and gzip already bring in.
tiff = ["dep:flate2"]
# zlib streams (RFC 1950) are DEFLATE plus a two-byte header and an Adler-32
# trailer, and both of those are a few lines here, so this costs no crate.
zlib = ["dep:flate2"]
# FITS tile compression: the payload of a `GZIP_1`/`GZIP_2` tile is a gzip
# member, so the DEFLATE codec and the CRC-32 that are already in the tree cover
# it and no new crate is needed (docs/dependencies.md §2.11). `crc32fast` is used
# by the verifier only — the writer's gzip framing comes from `flate2` — so the
# candidate's CRC-32 is checked by an implementation the writer never calls.
#
# **Not in `default`.** The size gate in `ci.yml` is this release's own measurement
# to the byte, and this handler's cost is measured by the feature matrix above it,
# not estimated (docs/size-budget.md §3); `--all-features` builds it on every CI
# run, and `cargo build --release --features fits` is how to ship it. The
# transformation is opt-in per run as well (`--fits-tile`), because it turns an
# `IMAGE` HDU into a `BINTABLE` and a pipeline that indexes `NAXIS1` notices.
fits = ["dep:flate2", "dep:crc32fast"]
zopfli = ["dep:zopfli"]
# Exposes the parsers to the fuzz targets in fuzz/. Never enabled for a release.
fuzz-api = []

[profile.release]
# This crate is where most size is bought: -Os keeps it about 10 % smaller for
# about 3 % on the real-file corpus. Dependencies stay at -O3 except the
# independent JPEG verifier, whose historical -Os measurement motivated the
# owner-authorized ceiling. The final tree still has to pass the size gate
# (docs/size-budget.md §5).
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# The codecs are hot: DEFLATE, the PNG decoder and Zopfli. They are compiled at
# full optimization; jpeg-decoder's size override is isolated below.
[profile.release.package."*"]
opt-level = 3

# The independent JPEG decoder is the one size-sensitive default dependency:
# this historical override produced the previously measured configuration; the
# owner-authorized 1,082,208-byte ceiling remains a final-tree gate.
[profile.release.package.jpeg-decoder]
opt-level = "s"

[lints.rust]
unsafe_code = "forbid"
